<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Чек возврат</title>
<!--
    В этом шаблоне специально нет плейсхолдера для логотипа.
    Если выбрать логотип, программа сама вставит его в начало документа.
-->
<style>
    @page { size: A4; margin: 15mm; }
    body {
        font-family: "Roboto", "Liberation Sans", sans-serif;
        font-size: 11pt;
        color: #222;
    }
    h1 { font-size: 18pt; color: #b00020; margin: 0 0 10px; }
    table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0;
    }
    th, td {
        border: 1px solid #b0b0b0;
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
        word-wrap: break-word;
        overflow-wrap: break-word;
        word-break: break-word;
    }
    th { background: #fbe9eb; width: 30%; }
    .sign { margin-top: 40px; }
    .sign span { display: inline-block; width: 45%; border-top: 1px solid #333; padding-top: 4px; font-size: 9pt; }
</style>
</head>
<body>

<h1>ЧЕК ВОЗВРАТА № {{number}}</h1>

<table>
    <tr><th>Дата возврата</th><td>{{date}}</td></tr>
    <tr><th>Покупатель</th><td>{{name}}</td></tr>
    <tr><th>Адрес</th><td>{{address}}</td></tr>
    <tr><th>Товар / услуга</th><td>{{service}}</td></tr>
    <tr><th>Сумма к возврату</th><td><b>{{amount}} руб.</b></td></tr>
    <tr><th>Способ возврата</th><td>{{payment}}</td></tr>
    <tr><th>Причина / комментарий</th><td>{{comment}}</td></tr>
</table>

<div class="sign">
    <span>Подпись кассира</span>
    &nbsp;&nbsp;&nbsp;
    <span>Подпись покупателя</span>
</div>

</body>
</html>
